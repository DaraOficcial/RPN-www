<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SKAK GAME</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }
        #ui-container {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }
        h1 {
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            margin-bottom: 5px;
        }
        #status {
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            padding: 10px;
        }
        canvas {
            width: 100%;
            height: 100%;
            background-color: #e0d8c3;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
        }
        #reset-btn {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: #e94560;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        #reset-btn:active {
            transform: scale(0.95);
            background: #cc3750;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>SKAK</h1>
        <div id="status">Memuat Game...</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>

    <button id="reset-btn" onclick="resetGame()">Reset Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        let assetsLoaded = 0;
        const totalAssets = 3;

        const imgBg = new Image();
        imgBg.src = 'kertas.png';
        imgBg.onload = assetLoaded;
        imgBg.onerror = assetError;

        const imgPion1 = new Image();
        imgPion1.src = 'pionkertas.png'; 
        imgPion1.onload = assetLoaded;
        imgPion1.onerror = assetError;

        const imgPion2 = new Image();
        imgPion2.src = 'pionkertasminyak.png'; 
        imgPion2.onload = assetLoaded;
        imgPion2.onerror = assetError;

        function assetLoaded() {
            assetsLoaded++;
            if (assetsLoaded === totalAssets) {
                initGame();
            }
        }

        function assetError() {
            initGame();
        }

        const padding = 60;
        const size = 600;
        const nodes = [
            { id: 0, x: padding, y: padding },             
            { id: 1, x: size / 2, y: padding },            
            { id: 2, x: size - padding, y: padding },       
            { id: 3, x: padding, y: size / 2 },            
            { id: 4, x: size / 2, y: size / 2 },           
            { id: 5, x: size - padding, y: size / 2 },      
            { id: 6, x: padding, y: size - padding },       
            { id: 7, x: size / 2, y: size - padding },      
            { id: 8, x: size - padding, y: size - padding } 
        ];

        const adjacencyList = [
            [1, 3, 4],       
            [0, 2, 4],       
            [1, 5, 4],       
            [0, 6, 4],       
            [0, 1, 2, 3, 5, 6, 7, 8], 
            [2, 8, 4],       
            [3, 7, 4],       
            [6, 8, 4],       
            [5, 7, 4]        
        ];

        const winLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]             
        ];

        let board = [];
        let currentPlayer = 1;
        let selectedNode = null;
        let winner = null;

        function initGame() {
            board = [2, 2, 2, 0, 0, 0, 1, 1, 1];
            currentPlayer = 1; 
            selectedNode = null;
            winner = null;
            updateStatus();
            draw();
        }

        function updateStatus() {
            if (winner) {
                statusDiv.innerText = `PLAYER ${winner} MENANG! 🎉`;
                statusDiv.style.background = winner === 1 ? '#4e9f3d' : '#d8b257';
            } else {
                statusDiv.innerText = `Giliran: Player ${currentPlayer} (${currentPlayer === 1 ? 'Kertas Putih' : 'Kertas Minyak'})`;
                statusDiv.style.background = 'rgba(255, 255, 255, 0.1)';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (imgBg.complete && imgBg.naturalWidth !== 0) {
                ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#e5dcc5';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = 'rgba(0, 0, 250, 0.08)';
                ctx.lineWidth = 2;
                for (let i = 40; i < canvas.height; i += 24) {
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
                }
            }

            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.strokeRect(padding, padding, size - padding * 2, size - padding * 2);

            ctx.beginPath();
            ctx.moveTo(nodes[0].x, nodes[0].y); ctx.lineTo(nodes[8].x, nodes[8].y);
            ctx.moveTo(nodes[2].x, nodes[2].y); ctx.lineTo(nodes[6].x, nodes[6].y);
            ctx.moveTo(nodes[1].x, nodes[1].y); ctx.lineTo(nodes[7].x, nodes[7].y);
            ctx.moveTo(nodes[3].x, nodes[3].y); ctx.lineTo(nodes[5].x, nodes[5].y);
            ctx.stroke();

            nodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#444444';
                ctx.fill();
            });

            if (selectedNode !== null) {
                ctx.beginPath();
                ctx.arc(nodes[selectedNode].x, nodes[selectedNode].y, 45, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(233, 69, 96, 0.6)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            const pionRadius = 35;
            board.forEach((player, index) => {
                if (player === 0) return;

                const node = nodes[index];
                
                if (player === 1) {
                    if (imgPion1.complete && imgPion1.naturalWidth !== 0) {
                        ctx.drawImage(imgPion1, node.x - pionRadius, node.y - pionRadius, pionRadius * 2, pionRadius * 2);
                    } else {
                        drawFallbackPion(node.x, node.y, '#ffffff', '#aaaaaa');
                    }
                } else if (player === 2) {
                    if (imgPion2.complete && imgPion2.naturalWidth !== 0) {
                        ctx.drawImage(imgPion2, node.x - pionRadius, node.y - pionRadius, pionRadius * 2, pionRadius * 2);
                    } else {
                        drawFallbackPion(node.x, node.y, '#b08968', '#7f5539');
                    }
                }
            });
        }

        function drawFallbackPion(x, y, fill, stroke) {
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 4;
            ctx.beginPath();
            ctx.arc(x, y, 32, 0, Math.PI * 2);
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
        }

        function handleInput(clientX, clientY) {
            if (winner) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (clientX - rect.left) * scaleX;
            const clickY = (clientY - rect.top) * scaleY;

            let clickedNodeIndex = null;
            for (let i = 0; i < nodes.length; i++) {
                const dist = Math.hypot(nodes[i].x - clickX, nodes[i].y - clickY);
                if (dist < 45) {
                    clickedNodeIndex = i;
                    break;
                }
            }

            if (clickedNodeIndex === null) return;

            const clickedOwner = board[clickedNodeIndex];

            if (selectedNode === null) {
                if (clickedOwner === currentPlayer) {
                    selectedNode = clickedNodeIndex;
                }
            } else {
                if (selectedNode === clickedNodeIndex) {
                    selectedNode = null;
                } 
                else if (clickedOwner === currentPlayer) {
                    selectedNode = clickedNodeIndex;
                } 
                else if (clickedOwner === 0) {
                    if (isValidMove(selectedNode, clickedNodeIndex)) {
                        board[clickedNodeIndex] = currentPlayer;
                        board[selectedNode] = 0;
                        selectedNode = null;

                        if (checkWin(currentPlayer)) {
                            winner = currentPlayer;
                        } else {
                            currentPlayer = currentPlayer === 1 ? 2 : 1;
                        }
                    }
                }
            }
            updateStatus();
            draw();
        }

        function isValidMove(fromIndex, toIndex) {
            return adjacencyList[fromIndex].includes(toIndex);
        }

        // PERBAIKAN ATURAN KEMENANGAN DI KANDANG SENDIRI
        function checkWin(player) {
            return winLines.some(line => {
                // Aturan khusus: Player 1 (Bawah) tidak boleh menang di kandangnya sendiri [6, 7, 8]
                if (player === 1 && line[0] === 6 && line[1] === 7 && line[2] === 8) {
                    return false;
                }
                // Aturan khusus: Player 2 (Atas) tidak boleh menang di kandangnya sendiri [0, 1, 2]
                if (player === 2 && line[0] === 0 && line[1] === 1 && line[2] === 2) {
                    return false;
                }

                return line.every(index => board[index] === player);
            });
        }

        function resetGame() {
            initGame();
        }

        canvas.addEventListener('mousedown', (e) => {
            handleInput(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            if (e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        initGame();
    </script>
</body>
</html>
